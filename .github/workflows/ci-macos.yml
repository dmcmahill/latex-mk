name: latex-mk CI - MacOS

on:
  push:
    branches:
      - develop
      - 'dev-*'
      - 'ci-*'
  pull_request:
    branches: [ develop ]
  # Allows you to run this workflow manually from the Actions tab:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      # Checks-out repository under $GITHUB_WORKSPACE:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: apt-get update
        run: sudo apt-get update

      - name: Install dependencies
        run: brew update
             brew install autoconf
             brew install automake
             brew install autopoint
             brew install bmake
             brew install ghostscript
             brew install texlive-bibtex-extra
             brew install texlive-latex-base
             brew install texlive-latex-extra
             brew install texlive-latex-recommended
             brew install texlive-publishers
             brew install latex2html
             brew install hevea
             brew install texinfo
             brew install texi2html
             brew install tgif
             brew install csh
             brew install ksh

      - name: Autogen
        run: ./autogen.sh

      - name: Configure
        run: ./configure

      - name: Build
        run: |
          make

      - name: Check
        run: |
          make check

      - name: Upload Test Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testsuite-log
          path: testsuite/test-suite.log

      - name: Display Test Output
        if: failure()
        run: ./ci/failures.sh

      - name: Distcheck
        run:  |
          make distcheck

      - name: Upload Tarball
        uses: actions/upload-artifact@v4
        with:
          name: testsuite-log
          path: testsuite/test-suite.log
